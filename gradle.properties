TINKER_VERSION=1.7.7
android.enableJetifier=true
android.useAndroidX=true
org.gradle.daemon=true
#org.gradle.jvmargs=-Xmx2048M -Dkotlin.daemon.jvm.options\="-Xmx2048M"
org.gradle.parallel=true

#true:Hummingbird generates a signed package   false: on the contrary
fnBuild = false
packageName=com.transsnet.store

#------ P2P  begin ------
DEBUG_LOG=false
android.useDeprecatedDdk=true

#debug
org.gradle.jvmargs=-Xmx4608M -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.warning.mode=all
STRICT_MODE=false
kotlin.code.style=official

#android.disableAutomaticComponentCreation=true

#--------------- P2P end -------------------

android.nonTransitiveRClass=false
android.nonFinalResIds=false
android.enableR8.fullMode=false

#gamespace The version number follows the format a.b.c.d, where:
# a is the requirement-driven major version [1-99],
# b.c is the requirement-driven minor version with b [1-9] and c [0-99],
# d is the development iteration build version [000-998], where 999 is reserved for development purposes.
gamespace_ver_name = 2.0.2.999

isDebugKitStandalone=false